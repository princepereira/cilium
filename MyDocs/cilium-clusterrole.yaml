apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get","list","watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get","list","watch"]
- apiGroups: [""]
  resources: ["namespaces","services","pods","nodes","secrets","configmaps"]
  verbs: ["get","list","watch"]
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["patch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get","list","watch"]
- apiGroups: ["cilium.io"]
  resources:
  - ciliumloadbalancerippools
  - ciliumclusterwidenetworkpolicies
  - ciliumendpoints
  - ciliumendpointslices
  - ciliumidentities
  - ciliumlocalredirectpolicies
  - ciliumnetworkpolicies
  - ciliumnodes
  - ciliumnodeconfigs
  - ciliumcidrgroups
  - ciliumpodippools
  verbs: ["list","watch"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumidentities","ciliumendpoints","ciliumnodes"]
  verbs: ["create"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumidentities"]
  verbs: ["update"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumendpoints"]
  verbs: ["delete","get"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumnodes","ciliumnodes/status"]
  verbs: ["get","update"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumendpoints/status","ciliumendpoints"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilium
subjects:
- kind: ServiceAccount
  name: cilium
  namespace: kube-system
