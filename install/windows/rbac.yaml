apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-agent-win
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-agent-win
rules:
  # Core control-plane state the agent watches to build services / endpoints /
  # node info. "namespaces" is mandatory: the k8s connection-readiness probe
  # performs Namespaces().Get("kube-system") (pkg/k8s/client/cell.go).
  - apiGroups: [""]
    resources: ["namespaces", "services", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  # CRD identity-allocation mode (--identity-allocation-mode=crd) requires the
  # Cilium CRDs to be present and writable by the agent.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumloadbalancerippools
      - ciliumbgpnodeconfigs
      - ciliumbgpadvertisements
      - ciliumbgppeerconfigs
      - ciliumclusterwideenvoyconfigs
      - ciliumclusterwidenetworkpolicies
      - ciliumegressgatewaypolicies
      - ciliumendpoints
      - ciliumendpointslices
      - ciliumenvoyconfigs
      - ciliumidentities
      - ciliumlocalredirectpolicies
      - ciliumnetworkpolicies
      - ciliumnodes
      - ciliumnodeconfigs
      - ciliumcidrgroups
      - ciliuml2announcementpolicies
      - ciliumpodippools
      - ciliumdatapathplugins
    verbs: ["list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumidentities", "ciliumendpoints", "ciliumnodes"]
    verbs: ["create"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumidentities"]
    verbs: ["update"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumendpoints"]
    verbs: ["delete", "get"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnodes", "ciliumnodes/status"]
    verbs: ["get", "update"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumendpoints/status", "ciliumendpoints"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-agent-win
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilium-agent-win
subjects:
  - kind: ServiceAccount
    name: cilium-agent-win
    namespace: kube-system
